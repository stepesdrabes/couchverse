name: android

# The Gradle project: the core built for every ABI with its Kotlin bindings tested on the JVM,
# the app's unit and Compose UI tests, Android lint and a debug APK on Linux; the Roborazzi
# screenshots are verified on macOS, where they are recorded (font rasterization differs by OS).
on:
  push:
    paths: [core/**, contract/**, clients/android/**, .github/workflows/android.yml]
  pull_request:
    paths: [core/**, contract/**, clients/android/**, .github/workflows/android.yml]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # caches dependencies and validates the committed wrapper
      - uses: gradle/actions/setup-gradle@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      # the NDK the Gradle build strips the libraries with, so both use the same one
      - name: Build the core for Android
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"$/\1/p' clients/android/gradle/libs.versions.toml)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ndk" make core-android
      # the screenshot job builds against the same libraries and bindings without Rust
      - uses: actions/upload-artifact@v4
        with:
          name: android-core
          path: |
            clients/android/core/src/main/jniLibs
            clients/android/core/build/generated/uniffi
          retention-days: 1
      # the release build runs R8 over the app, which a debug build never does; it is signed with
      # the debug key here (release.yml signs the published one)
      - name: Test, lint and assemble
        working-directory: clients/android
        run: ./gradlew testDebugUnitTest lintDebug :app:assembleDebug :app:assembleRelease
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: clients/android/**/build/reports

  screenshots:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v5
        with:
          name: android-core
          path: clients/android/core
      - name: Verify the screenshots
        working-directory: clients/android
        run: ./gradlew verifyRoborazziDebug
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: clients/android/**/build/outputs/roborazzi
