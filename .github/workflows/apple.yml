name: apple

# The iOS, iPadOS and tvOS apps: swift-format, the core packaged for Apple, the package tests
# (runtime and executors on the host; design and screens, snapshots included, on iOS and tvOS
# simulators) and a smoke UI test of each app.
on:
  push:
    paths: [core/**, contract/**, clients/apple/**, Makefile, .github/workflows/apple.yml]
  pull_request:
    paths: [core/**, contract/**, clients/apple/**, Makefile, .github/workflows/apple.yml]

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          major=$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')
          # the apps target iOS/tvOS 27; an image without Xcode 27 runs what it can
          if [ "$major" -ge 27 ]; then
            echo "FULL=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Xcode $major on this runner: the iOS/tvOS 27 suites need Xcode 27 and run locally (make apple-test apple-uitest)"
          fi
      - name: Lint Swift
        run: make apple-lint
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-tvos,aarch64-apple-tvos-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build the core
        run: make core-apple
      - name: Core package tests (host)
        if: env.FULL != '1'
        run: cd clients/apple/Packages/CouchverseCore && swift test
      # a runner image can carry Xcode 27 without its runtimes
      - name: Simulator runtimes
        if: env.FULL == '1'
        run: |
          for platform in iOS tvOS; do
            have=$(xcrun simctl list runtimes -j | jq --arg p "$platform" \
              '[.runtimes[] | select(.platform == $p and .isAvailable and (.version | startswith("27")))] | length')
            [ "$have" -gt 0 ] || xcodebuild -downloadPlatform "$platform"
          done
          xcrun simctl list runtimes
      # the device types the snapshot references were recorded on (an iPhone 17, an Apple TV 4K
      # at 4K), on the newest runtimes
      - name: Create simulators
        if: env.FULL == '1'
        run: make apple-sims
      - name: Package tests
        if: env.FULL == '1'
        run: make apple-test
        env:
          # snapshot failures are written here (xcodebuild strips the prefix for the test runner)
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshots
      - name: Smoke UI tests
        if: env.FULL == '1'
        run: make apple-uitest
      - name: Keep failed snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
