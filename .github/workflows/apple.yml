name: apple

# The iOS, iPadOS and tvOS apps: swift-format, the core packaged for Apple, the package tests
# (runtime and executors on the host; design and screens, snapshots included, on iOS and tvOS
# simulators) and a smoke UI test of each app.
on:
  push:
    paths: [core/**, contract/**, clients/apple/**, Makefile, .github/workflows/apple.yml]
  pull_request:
    paths: [core/**, contract/**, clients/apple/**, Makefile, .github/workflows/apple.yml]

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Lint Swift
        run: make apple-lint
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-tvos,aarch64-apple-tvos-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build the core
        run: make core-apple
      # the apps target iOS/tvOS 27; a runner image can carry the Xcode without its runtimes
      - name: Simulator runtimes
        run: |
          for platform in iOS tvOS; do
            have=$(xcrun simctl list runtimes -j | jq --arg p "$platform" \
              '[.runtimes[] | select(.platform == $p and .isAvailable and (.version | startswith("27")))] | length')
            [ "$have" -gt 0 ] || xcodebuild -downloadPlatform "$platform"
          done
          xcrun simctl list runtimes
      - name: Create simulators
        run: |
          runtime() { xcrun simctl list runtimes -j | jq -r --arg p "$1" \
            '[.runtimes[] | select(.platform == $p and .isAvailable and (.version | startswith("27")))] | last | .identifier'; }
          # the devices the snapshot references were recorded on (the Makefile's defaults)
          xcrun simctl create "CI iPhone" "iPhone 17" "$(runtime iOS)"
          xcrun simctl create "CI Apple TV" "Apple TV 4K (3rd generation)" "$(runtime tvOS)"
          echo "IOS_SIM=CI iPhone" >> "$GITHUB_ENV"
          echo "TV_SIM=CI Apple TV" >> "$GITHUB_ENV"
      - name: Package tests
        run: make apple-test
        env:
          # snapshot failures are written here (xcodebuild strips the prefix for the test runner)
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshots
      - name: Smoke UI tests
        run: make apple-uitest
      - name: Keep failed snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
