name: backend

on:
  push:
    paths: [backend/**, contract/fixtures/device-profiles/**, .github/workflows/backend.yml]
  pull_request:
    paths: [backend/**, contract/fixtures/device-profiles/**, .github/workflows/backend.yml]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: couchverse
          POSTGRES_USER: couchverse
          POSTGRES_PASSWORD: couchverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U couchverse"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://couchverse:couchverse@localhost:5432/couchverse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
      # the playback tiers test (TestPlaybackTiers) prepares sample media with ffmpeg
      # and checks every HLS presentation with the validator
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go test ./...
      - run: go build ./cmd/couchverse
