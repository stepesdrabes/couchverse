name: core

# Packages the shared core for the web and runs it there; apple.yml and android.yml do the same
# for the native shells. Lint and unit tests of the Rust workspace run in contract.yml.
on:
  push:
    paths: [core/**, contract/**, .github/workflows/core.yml]
  pull_request:
    paths: [core/**, contract/**, .github/workflows/core.yml]

env:
  CARGO_TERM_COLOR: always
  BINARYEN_VERSION: "133"

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install wasm-opt
        run: |
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      # fails when the package is over its size budget
      - run: make core-wasm
