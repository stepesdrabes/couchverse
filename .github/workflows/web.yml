name: web

on:
  push:
    paths: [clients/web/**, .github/workflows/web.yml]
  pull_request:
    paths: [clients/web/**, .github/workflows/web.yml]

defaults:
  run:
    working-directory: clients/web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
