[workspace]
resolver = "3"
members = ["crates/api", "crates/app", "crates/ffi", "crates/wasm", "crates/uniffi-bindgen", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
couchverse-api = { path = "crates/api" }
couchverse-core = { path = "crates/app" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# the annotation only: the typeshare crate drags chrono and core-foundation into every slice
typeshare = { package = "typeshare-annotation", version = "1.0.5" }
pulldown-cmark = { version = "0.13.4", default-features = false }
# only the bindgen crate enables the CLI; mobile slices must not compile cargo_metadata
uniffi = { version = "0.32.2", default-features = false }
# the crate and xtask's bindgen library must be the same version, or the glue is rejected
wasm-bindgen = "=0.2.129"
wasm-bindgen-cli-support = "=0.2.129"
linkify = "0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

# the web build: a panic traps the instance anyway, so unwinding tables are dead weight
[profile.release-wasm]
inherits = "release"
panic = "abort"
strip = true
