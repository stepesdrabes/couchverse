services:
  app:
    build: .
    ports:
      - "8080:8080"
    # match the owner of MEDIA_ROOT when using a bind mount (id -u / id -g);
    # the default works out of the box with the named volume
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      DATABASE_URL: postgres://couchverse:${DB_PASSWORD}@db:5432/couchverse
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECURE: "false" # set to true behind a TLS reverse proxy
      JOB_WORKERS: "2"
    volumes:
      # default: Docker-managed named volume (no permission issues, but media
      # is only reachable through the app). To use a real disk folder instead,
      # set MEDIA_ROOT=/path/to/disk in .env and PUID/PGID to its owner.
      - ${MEDIA_ROOT:-mediadata}:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: couchverse
      POSTGRES_USER: couchverse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # loopback only — for local development (`make run-backend`)
      - "127.0.0.1:5432:5432"
    volumes:
      # on a Raspberry Pi keep this off the SD card (bind-mount to SSD/USB)
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couchverse"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  mediadata:
