<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Couch TV sample reel</title>
		<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
		<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<!-- the Couch TV display face (OFL); the product will bundle it -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400..800&display=block" />
		<link rel="stylesheet" href="css/tv.css" />
		<link rel="stylesheet" href="css/reel.css" />
	</head>
	<body>
		<main class="reel">
			<div class="viewport" id="viewport">
				<div class="stage" id="stage"></div>
				<div class="loading" id="loading">Loading artwork and soundtracks</div>
			</div>
			<footer class="bar">
				<div class="bar-row">
					<button class="btn icon" id="playBtn" type="button" aria-label="Play">
						<svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" /></svg>
						<svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2" /><rect x="13.5" y="5" width="4" height="14" rx="1.2" /></svg>
					</button>
					<div class="scrub">
						<div class="cue-marks" id="cueMarks"></div>
						<input type="range" id="scrub" min="0" max="10" step="0.01" value="0" aria-label="Scrub" />
					</div>
					<div class="readout tnum"><span id="tRead">0.00</span><span class="faint"> / <span id="dRead">0.00</span> s</span></div>
				</div>
				<div class="bar-row">
					<div class="pieces" id="pieces" role="tablist"></div>
					<div class="spacer"></div>
					<div class="cue" id="cueRead"></div>
					<div class="pick" title="Ident variant">
						<span class="pick-label" id="identLabel">Ident</span>
						<div class="seg" id="variantSeg">
							<button type="button" data-variant="a">A</button>
							<button type="button" data-variant="b">B</button>
						</div>
					</div>
					<div class="pick" title="Theme arrangement">
						<span class="pick-label" id="themeLabel">Theme</span>
						<div class="seg" id="themeSeg">
							<button type="button" data-theme="1">1</button>
							<button type="button" data-theme="2">2</button>
							<button type="button" data-theme="3">3</button>
						</div>
					</div>
					<button class="btn primary" id="breakBtn" type="button">Play full break</button>
					<div class="seg" id="langSeg">
						<button type="button" data-lang="en">EN</button>
						<button type="button" data-lang="cs">CS</button>
					</div>
					<button class="btn icon" id="muteBtn" type="button" aria-label="Mute">
						<svg class="i-on" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z" /><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
						<svg class="i-off" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z" /><path d="m16 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
					</button>
				</div>
			</footer>
		</main>
		<script type="module" src="js/reel.js"></script>
	</body>
</html>
